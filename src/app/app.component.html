<head><link rel="stylesheet"

<div *ngIf="showSplash" [ngStyle]="{ left: windowWidth }" class="app-loading">
  <div class="logo">
    <img src="assets/mobile_backgrounds/Frame2.png">
  </div>
  <svg class="spinner" viewBox="25 25 50 50">
    <circle class="path" cx="50" cy="50" r="10" fill="none" stroke-width="2" stroke-miterlimit="10"/>
  </svg>
</div>

<ion-content *ngIf="!authorized">

  <div>
  <ngb-carousel class="p-4" style="margin-top: 75%;">
		@for (image of images; track image) {
			<ng-template ngbSlide>
				<div class="picsum-img-wrapper">
					<img [src]="image" alt="Random slide" />
				</div>
				<div class="carousel-caption">
					<h3>No mouse navigation</h3>
					<p>This carousel hides navigation arrows and indicators.</p>
				</div>
			</ng-template>
		}
	</ngb-carousel>
</div>

  <div>
  <div class="d-flex justify-content-center" style="position: absolute; bottom: 5%">
    <div class="d-flex">
      <img src="assets/mobile_backgrounds/Book_Masked.png" (click)="login()" class="login-button">

</ion-content>
<router-outlet *ngIf="authorized">
  
</router-outlet>
<ion-toolbar *ngIf="authorized" class="nav-bar">
  <ion-tabs>

    <ion-tab-bar slot="bottom" layout="icon-top" class="nav-bar-item">
      <ion-tab-button tab="home">
        <i class="fa-solid fa-house-chimney fa-xl nav-icon"></i>
        <ion-label>Home</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="clients" layout="icon-top">
        <i class="fa-solid fa-users fa-xl nav-icon"></i>
        <ion-label>Clients</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="appointments" layout="icon-top">
        <i class="fa-solid fa-calendar-days fa-xl nav-icon"></i>
        <ion-label>Meetings</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="account" layout="icon-top">
        <i class="fa-solid fa-gears fa-xl nav-icon"></i>
        <ion-label>Account</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  
  </ion-tabs>
  </ion-toolbar>
