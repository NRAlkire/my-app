<head><link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<div id="appLoadingDiv" *ngIf="showSplash" [ngStyle]="{ left: windowWidth }" class="app-loading">
  <div id="logoDiv" class="logo">
    <img id="logoImage" src="assets/mobile_backgrounds/Frame2.png">
  </div>
  <svg id="spinner" class="spinner" viewBox="25 25 50 50">
    <circle class="path" cx="50" cy="50" r="10" fill="none" stroke-width="2" stroke-miterlimit="10"/>
  </svg>
</div>

<ion-content *ngIf="!authorized">

  <div>
  <ngb-carousel id="chooseYourAdventureCarousel" class="p-4" style="margin-top: 75%;">
		@for (image of images; track image) {
			<ng-template ngbSlide>
				<div>
					<img id="carouselImage" [src]="image" alt="Random slide" />
				</div>
			</ng-template>
		}
	</ngb-carousel>
</div>

  <div id="loginButtonDiv" class="d-flex justify-content-center" style="position: absolute; bottom: 5%">
    <div class="d-flex">
      <img id="storyTellerLoginButton" src="assets/mobile_backgrounds/Book_Masked.png" (click)="storytellerLogin()" class="login-button">
    </div>
    <div class="d-flex">
      <img id="playerLoginButton" src="assets/mobile_backgrounds/Samurai_Masked.png" (click)="playerLogin()" class="login-button">
    </div>
  </div>

</ion-content>
<router-outlet id="routerOutlet" *ngIf="authorized">
  
</router-outlet>
<ion-toolbar id="navToolbar" *ngIf="authorized" class="nav-bar">
  <ion-tabs>

    <ion-tab-bar *ngIf="role==='Storyteller'" id="navTabBar" slot="bottom" layout="icon-top" class="nav-bar-item">

      <ion-tab-button tab="storytellerHome">
        <i class="fa-solid fa-house-chimney fa-xl nav-icon"></i>
        <ion-label>Home</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="worldbuilding" layout="icon-top">
        <i class="fa-solid fa-earth-americas fa-xl nav-icon"></i>
        <ion-label>Worldbuilding</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="campaigns" layout="icon-top">
        <i class="fa-solid fa-map fa-xl nav-icon"></i>
        <ion-label>Campaigns</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="account" layout="icon-top">
        <i class="fa-solid fa-gears fa-xl nav-icon"></i>
        <ion-label>Account</ion-label>
      </ion-tab-button>

    </ion-tab-bar>

    <ion-tab-bar *ngIf="role==='Player'" id="navTabBar" slot="bottom" layout="icon-top" class="nav-bar-item">

      <ion-tab-button tab="playerHome">
        <i class="fa-solid fa-house-chimney fa-xl nav-icon"></i>
        <ion-label>Home</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="characters" layout="icon-top">
        <i class="fa-solid fa-users fa-xl nav-icon"></i>
        <ion-label>Characters</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="campaigns" layout="icon-top">
        <i class="fa-solid fa-map fa-xl nav-icon"></i>
        <ion-label>Campaigns</ion-label>
      </ion-tab-button>
  
      <ion-tab-button tab="account" layout="icon-top">
        <i class="fa-solid fa-gears fa-xl nav-icon"></i>
        <ion-label>Account</ion-label>
      </ion-tab-button>
      
    </ion-tab-bar>
  
  </ion-tabs>
  </ion-toolbar>
